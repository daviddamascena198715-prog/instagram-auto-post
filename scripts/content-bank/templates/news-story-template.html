<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A24B; --gold-light:#E4C97A; --dark-bg:#0A0B12;
    --cream:#F3EFE4; --cream-soft:rgba(243,239,228,0.62);
    --blue:#5B9BD5; --green:#6FCF97; --red:#E36F6F; --yellow:#E0C25B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#000;}
  body{font-family:'Outfit',sans-serif;}
  .serif{font-family:'Fraunces',serif;font-optical-sizing:auto;}

  .slide{
    width:420px;height:747px;position:relative;overflow:hidden;
    background:radial-gradient(90% 70% at 85% 12%, rgba(201,162,75,0.22) 0%, rgba(201,162,75,0) 55%), var(--dark-bg);
    display:flex;flex-direction:column;
  }
  .slide::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 45%),
               radial-gradient(140% 100% at 50% 120%, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 55%);
    pointer-events:none;z-index:1;
  }
  .badge-top{
    position:absolute;top:28px;right:28px;z-index:3;display:flex;align-items:center;gap:7px;
    padding:6px 12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;font-size:10px;font-weight:600;letter-spacing:1px;color:var(--cream);
  }
  .badge-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:0 36px 56px;justify-content:center;}

  .visual{display:flex;align-items:center;gap:16px;margin-bottom:34px;flex-wrap:wrap;}
  .icon-circle{
    width:104px;height:104px;border-radius:50%;flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, rgba(228,201,122,0.9), rgba(201,162,75,0.15) 70%);
    border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 30px rgba(201,162,75,0.35), inset 0 0 18px rgba(0,0,0,0.35);
  }
  .icon-circle svg{width:52px;height:52px;}
  .mini-stack{display:flex;flex-direction:column;gap:10px;}
  .pill{
    display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:16px;
    font-size:11.5px;font-weight:600;letter-spacing:0.4px;width:fit-content;
  }
  .tone-blue{background:rgba(91,155,213,0.14);border:1px solid rgba(91,155,213,0.4);color:var(--blue);}
  .tone-green{background:rgba(111,207,151,0.14);border:1px solid rgba(111,207,151,0.4);color:var(--green);}
  .tone-red{background:rgba(227,111,111,0.14);border:1px solid rgba(227,111,111,0.4);color:var(--red);}
  .tone-yellow{background:rgba(224,194,91,0.14);border:1px solid rgba(224,194,91,0.4);color:var(--yellow);}
  .pill svg{display:block;}

  .tag{
    display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:2.5px;
    margin-bottom:18px;text-transform:uppercase;color:var(--gold-light);
  }
  .tag::before{content:"";width:16px;height:1.5px;background:currentColor;opacity:0.7;}

  .chart-wrap{display:flex;flex-direction:column;gap:16px;margin-bottom:30px;}
  .chart-row{display:flex;flex-direction:column;gap:7px;}
  .chart-row-top{display:flex;justify-content:space-between;align-items:baseline;}
  .chart-label{font-size:13px;font-weight:600;color:var(--cream-soft);}
  .chart-value{font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--gold-light);}
  .chart-track{height:12px;border-radius:7px;background:rgba(255,255,255,0.08);overflow:hidden;}
  .chart-fill{height:100%;border-radius:7px;}

  .stat-wrap{display:flex;flex-direction:column;gap:2px;margin-bottom:30px;}
  .stat-value{font-size:80px;font-weight:700;color:var(--gold);line-height:1;letter-spacing:-1px;}
  .stat-label{font-size:13.5px;font-weight:600;color:var(--cream-soft);letter-spacing:0.3px;margin-top:6px;}

  .headline{font-weight:600;line-height:1.1;letter-spacing:-0.5px;margin-bottom:14px;color:var(--cream);font-size:32px;}
  .headline .hl{color:var(--gold);}
  .body-text{font-size:14.5px;line-height:1.6;font-weight:400;letter-spacing:0.1px;color:var(--cream-soft);}

  .story-hint{
    position:absolute;bottom:36px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;
    z-index:3;color:rgba(255,255,255,0.6);font-size:11px;letter-spacing:1px;text-transform:uppercase;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const ICONS = {
    dollar: '<span style="font-family:Fraunces,serif;font-weight:700;font-size:52px;color:var(--dark-bg);">$</span>',
    politics: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3l7 4v2H5V7l7-4z" stroke="#0A0B12" stroke-width="1.6" stroke-linejoin="round" fill="#0A0B12" fill-opacity="0.85"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8" stroke="#0A0B12" stroke-width="1.6"/><path d="M4 20h16" stroke="#0A0B12" stroke-width="1.8" stroke-linecap="round"/></svg>',
    conflict: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 5-3.2 8.5-7 11-3.8-2.5-7-6-7-11V5l7-3z" stroke="#0A0B12" stroke-width="1.7" stroke-linejoin="round" fill="#0A0B12" fill-opacity="0.85"/></svg>',
    nature: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#0A0B12" stroke-width="1.7" fill="#0A0B12" fill-opacity="0.85"/><path d="M12 3c2.5 3 2.5 15 0 18M3 12c3-2.5 15-2.5 18 0" stroke="#0A0B12" stroke-width="1.4"/></svg>',
    tech: '<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="1.5" stroke="#0A0B12" stroke-width="1.7" fill="#0A0B12" fill-opacity="0.85"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3" stroke="#0A0B12" stroke-width="1.5" stroke-linecap="round"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#0A0B12" stroke-width="1.7"/><circle cx="12" cy="12" r="5" stroke="#0A0B12" stroke-width="1.5"/><circle cx="12" cy="12" r="1.6" fill="#0A0B12"/></svg>',
    briefcase: '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="12" rx="1.8" stroke="#0A0B12" stroke-width="1.7" fill="#0A0B12" fill-opacity="0.85"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="#0A0B12" stroke-width="1.6"/><path d="M3 13h18" stroke="#0A0B12" stroke-width="1.4"/></svg>'
  };
  const PILL_ICONS = {
    check: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/><path d="M8 12l2.5 2.5L16 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    trend: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M3 17l6-6 4 4 8-8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    alert: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3l9 16H3l9-16z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v4M12 16.5v.1" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
    dot: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" fill="currentColor"/></svg>'
  };

  const TONE_COLOR = { blue: 'var(--blue)', green: 'var(--green)', red: 'var(--red)', yellow: 'var(--yellow)', gold: 'var(--gold)' };

  function renderBarChart(v) {
    const bars = v.bars || [];
    const maxVal = v.maxOverride || Math.max(...bars.map(b => b.value), 1);
    const rows = bars.map(b => {
      const pct = Math.max(4, Math.round((b.value / maxVal) * 100));
      const color = TONE_COLOR[b.tone || 'gold'];
      return `<div class="chart-row">
        <div class="chart-row-top">
          <span class="chart-label">${b.label}</span>
          <span class="chart-value">${b.value}${v.unit || ''}</span>
        </div>
        <div class="chart-track"><div class="chart-fill" style="width:${pct}%;background:${color};"></div></div>
      </div>`;
    }).join("");
    return `<div class="chart-wrap">${rows}</div>`;
  }

  function renderStat(v) {
    return `<div class="stat-wrap">
      <div class="serif stat-value">${v.value}</div>
      <div class="stat-label">${v.label}</div>
    </div>`;
  }

  function render(d) {
    const vtype = (d.visual && d.visual.type) || 'icon';
    let visualHtml;
    if (vtype === 'bar_chart') {
      visualHtml = renderBarChart(d.visual);
    } else if (vtype === 'stat') {
      visualHtml = renderStat(d.visual);
    } else {
      const icon = ICONS[d.icon] || ICONS.tech;
      const badges = (d.badges || []).map(b =>
        `<div class="pill tone-${b.tone || 'blue'}">${PILL_ICONS[b.icon || 'dot']}${b.label}</div>`
      ).join("");
      visualHtml = `<div class="visual">
          <div class="icon-circle">${icon}</div>
          <div class="mini-stack">${badges}</div>
        </div>`;
    }

    return `<div class="slide">
      <div class="badge-top"><span class="badge-dot"></span>davidaraujogestor</div>
      <div class="content">
        ${visualHtml}
        <span class="tag">${d.tag}</span>
        <h2 class="serif headline">${d.headline}</h2>
        <p class="body-text">${d.body}</p>
      </div>
      <div class="story-hint">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        arraste pra cima
      </div>
    </div>`;
  }

  const DATA = __SLIDE_DATA__;
  document.getElementById("root").innerHTML = render(DATA);
</script>
</body>
</html>
