<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrossel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A24B; --gold-light:#E4C97A; --dark-bg:#0A0B12;
    --cream:#F3EFE4; --cream-soft:rgba(243,239,228,0.62);
    --blue:#5B9BD5; --green:#6FCF97; --red:#E36F6F; --yellow:#E0C25B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#000;}
  body{font-family:'Outfit',sans-serif;}
  .serif{font-family:'Fraunces',serif;font-optical-sizing:auto;}

  .slide{
    width:420px;height:525px;position:relative;overflow:hidden;
    background:radial-gradient(90% 70% at 85% 12%, rgba(201,162,75,0.20) 0%, rgba(201,162,75,0) 55%), var(--dark-bg);
    display:flex;flex-direction:column;
  }
  .slide::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0) 45%),
               radial-gradient(140% 100% at 50% 120%, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0) 55%);
    pointer-events:none;z-index:1;
  }
  .badge-top{
    position:absolute;top:24px;right:24px;z-index:3;display:flex;align-items:center;gap:7px;
    padding:6px 12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);
    border-radius:20px;font-size:9.5px;font-weight:600;letter-spacing:1px;color:var(--cream);
  }
  .badge-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}

  .content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:32px 32px 44px;justify-content:center;}

  .divider{width:40px;height:2px;background:var(--gold);margin-bottom:16px;}

  .tag{
    display:flex;align-items:center;gap:8px;font-size:10px;font-weight:600;letter-spacing:2.5px;
    margin-bottom:16px;text-transform:uppercase;color:var(--gold-light);
  }

  .icon-circle{
    width:88px;height:88px;border-radius:50%;flex-shrink:0;margin-bottom:22px;
    background:radial-gradient(circle at 35% 30%, rgba(228,201,122,0.9), rgba(201,162,75,0.15) 70%);
    border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 26px rgba(201,162,75,0.32), inset 0 0 16px rgba(0,0,0,0.35);
  }
  .icon-circle svg{width:44px;height:44px;}

  .headline{font-weight:600;line-height:1.12;letter-spacing:-0.4px;margin-bottom:14px;color:var(--cream);}
  .headline .hl{color:var(--gold);}
  .headline.capa{font-size:30px;}
  .headline.interior{font-size:24px;}
  .headline.cta{font-size:26px;text-align:center;}

  .body-text{font-size:13.5px;line-height:1.55;font-weight:400;letter-spacing:0.1px;color:var(--cream-soft);}

  .chart-wrap{display:flex;flex-direction:column;gap:14px;margin-bottom:8px;}
  .chart-row{display:flex;flex-direction:column;gap:6px;}
  .chart-row-top{display:flex;justify-content:space-between;align-items:baseline;}
  .chart-label{font-size:12.5px;font-weight:600;color:var(--cream-soft);}
  .chart-value{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--gold-light);}
  .chart-track{height:10px;border-radius:6px;background:rgba(255,255,255,0.08);overflow:hidden;}
  .chart-fill{height:100%;border-radius:6px;}

  .stat-wrap{display:flex;flex-direction:column;gap:2px;margin-bottom:8px;}
  .stat-value{font-size:56px;font-weight:700;color:var(--gold);line-height:1;letter-spacing:-1px;}
  .stat-label{font-size:12.5px;font-weight:600;color:var(--cream-soft);letter-spacing:0.3px;margin-top:6px;}

  .step-badge{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;margin-bottom:16px;
    background:rgba(201,162,75,0.14);border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--gold-light);
  }

  .swipe-hint{
    display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:18px;
    color:var(--gold-light);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  }

  .progress-wrap{position:absolute;bottom:0;left:0;right:0;padding:14px 24px 20px;display:flex;align-items:center;gap:9px;z-index:10;}
  .progress-track{flex:1;height:3px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,0.1);}
  .progress-fill{height:100%;border-radius:2px;background:var(--gold);}
  .progress-label{font-size:10.5px;font-weight:600;color:rgba(255,255,255,0.45);font-variant-numeric:tabular-nums;}

  .cta-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .cta-btn{
    display:inline-flex;align-items:center;gap:9px;padding:14px 28px;background:var(--gold);color:var(--dark-bg);
    font-weight:700;font-size:14px;letter-spacing:0.2px;border-radius:30px;margin-top:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const ICONS = {
    target: '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#0A0B12" stroke-width="1.7"/><circle cx="12" cy="12" r="5" stroke="#0A0B12" stroke-width="1.5"/><circle cx="12" cy="12" r="1.6" fill="#0A0B12"/></svg>',
    briefcase: '<svg viewBox="0 0 24 24" fill="none"><rect x="3" y="8" width="18" height="12" rx="1.8" stroke="#0A0B12" stroke-width="1.7" fill="#0A0B12" fill-opacity="0.85"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="#0A0B12" stroke-width="1.6"/><path d="M3 13h18" stroke="#0A0B12" stroke-width="1.4"/></svg>'
  };

  const TONE_COLOR = { blue: 'var(--blue)', green: 'var(--green)', red: 'var(--red)', yellow: 'var(--yellow)', gold: 'var(--gold)' };

  function renderBarChart(v) {
    const bars = v.bars || [];
    const maxVal = v.maxOverride || Math.max(...bars.map(b => b.value), 1);
    const rows = bars.map(b => {
      const pct = Math.max(4, Math.round((b.value / maxVal) * 100));
      const color = TONE_COLOR[b.tone || 'gold'];
      return `<div class="chart-row">
        <div class="chart-row-top">
          <span class="chart-label">${b.label}</span>
          <span class="chart-value">${b.value}${v.unit || ''}</span>
        </div>
        <div class="chart-track"><div class="chart-fill" style="width:${pct}%;background:${color};"></div></div>
      </div>`;
    }).join("");
    return `<div class="chart-wrap">${rows}</div>`;
  }

  function renderStat(v) {
    return `<div class="stat-wrap">
      <div class="serif stat-value">${v.value}</div>
      <div class="stat-label">${v.label}</div>
    </div>`;
  }

  function renderSlide(s, opts) {
    let inner = "";

    if (s.type === "capa") {
      const icon = ICONS[s.icon] || ICONS.target;
      inner = `
        <div class="icon-circle">${icon}</div>
        ${s.tag ? `<span class="tag">${s.tag}</span>` : ""}
        <h2 class="serif headline capa">${s.headline}</h2>
        ${s.body ? `<p class="body-text">${s.body}</p>` : ""}
        <div class="swipe-hint">
          <span>arrasta pra ver</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>`;
    } else if (s.type === "interior") {
      inner = `
        ${opts.stepNumber ? `<div class="step-badge">${opts.stepNumber}</div>` : ""}
        <div class="divider"></div>
        <h2 class="serif headline interior">${s.headline}</h2>
        <p class="body-text">${s.body}</p>`;
    } else if (s.type === "chart") {
      const visualHtml = s.visual && s.visual.type === "stat" ? renderStat(s.visual) : renderBarChart(s.visual || {});
      inner = `
        ${opts.stepNumber ? `<div class="step-badge">${opts.stepNumber}</div>` : ""}
        <div class="divider"></div>
        <h2 class="serif headline interior">${s.headline}</h2>
        ${visualHtml}
        ${s.body ? `<p class="body-text">${s.body}</p>` : ""}`;
    } else if (s.type === "cta") {
      inner = `
        <div class="cta-wrap" style="width:100%;">
          <div class="divider" style="margin:0 auto 16px;"></div>
          <h2 class="serif headline cta">${s.headline}</h2>
          <p class="body-text">${s.body || ""}</p>
          <div class="cta-btn">${s.ctaLabel}</div>
        </div>`;
    }

    let progress = "";
    if (opts.total > 1) {
      const pct = ((opts.index + 1) / opts.total) * 100;
      progress = `<div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
        <span class="progress-label">${opts.index + 1}/${opts.total}</span>
      </div>`;
    }

    return `<div class="slide">
      <div class="badge-top"><span class="badge-dot"></span>davidaraujogestor</div>
      <div class="content">${inner}</div>
      ${progress}
    </div>`;
  }

  const SLIDES = __SLIDES_DATA__;
  let stepCounter = 0;
  document.getElementById("root").innerHTML = SLIDES.map((s, i) => {
    const isNumbered = s.type === "interior" || s.type === "chart";
    if (isNumbered) stepCounter++;
    return renderSlide(s, { total: SLIDES.length, index: i, stepNumber: isNumbered ? stepCounter : null });
  }).join("");
</script>
</body>
</html>
