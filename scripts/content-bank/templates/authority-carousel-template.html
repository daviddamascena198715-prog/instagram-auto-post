<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrossel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A24B; --gold-light:#E4C97A; --dark-bg:#0A0B12; --ink:#0A0B12;
    --cream:#F3EFE4; --cream-soft:rgba(243,239,228,0.62);
    --blue:#5B9BD5; --green:#6FCF97; --red:#E36F6F; --yellow:#E0C25B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#000;}
  body{font-family:'Outfit',sans-serif;}
  .serif{font-family:'Fraunces',serif;font-optical-sizing:auto;}

  /* Tom escuro (padrão) — fundo preto/azul-marinho com brilho dourado */
  .slide{
    width:420px;height:525px;position:relative;overflow:hidden;
    display:flex;flex-direction:column;
    --bg: radial-gradient(120% 85% at 88% 6%, rgba(201,162,75,0.16) 0%, rgba(201,162,75,0) 50%), var(--dark-bg);
    --text-primary: var(--cream);
    --text-secondary: rgba(243,239,228,0.58);
    --hairline: rgba(255,255,255,0.14);
    --rule-strong: rgba(255,255,255,0.16);
    --track-bg: rgba(255,255,255,0.10);
    --grain-blend: overlay; --grain-opacity: 0.05;
    background:var(--bg);
  }
  /* Tom claro (alternado) — fundo creme quente, mesmos acentos dourados */
  .slide.tone-light{
    --bg: radial-gradient(120% 85% at 88% 6%, rgba(201,162,75,0.14) 0%, rgba(201,162,75,0) 50%), var(--cream);
    --text-primary: #15161F;
    --text-secondary: rgba(21,22,31,0.60);
    --hairline: rgba(21,22,31,0.14);
    --rule-strong: rgba(21,22,31,0.20);
    --track-bg: rgba(21,22,31,0.10);
    --grain-blend: multiply; --grain-opacity: 0.035;
    background:var(--bg);
  }

  /* Grão sutil — quebra o gradiente flat, dá peso de impressão premium */
  .slide::after{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    mix-blend-mode:var(--grain-blend);opacity:var(--grain-opacity);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* Marca de assinatura — traço diagonal dourado + ponto, sempre no rodapé (reconhecimento de marca em miniatura, nunca colide com o texto) */
  .footer-sig{position:relative;width:22px;height:16px;flex-shrink:0;}
  .footer-sig::before{content:"";position:absolute;right:1px;bottom:6px;width:17px;height:1px;background:var(--gold);transform:rotate(-38deg);transform-origin:right center;opacity:0.85;}
  .footer-sig::after{content:"";position:absolute;right:0;bottom:0;width:3.5px;height:3.5px;border-radius:50%;background:var(--gold);}

  /* Masthead — assinatura tipográfica no topo, faixa fina em vez de badge/pill */
  .masthead{
    position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
    padding:22px 28px 14px;border-bottom:1px solid var(--hairline);
  }
  .wordmark{font-size:9.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;color:var(--text-primary);opacity:0.72;}
  .kicker{font-size:9.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);}

  .content{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding:0 28px 30px;}
  .content-top-space{flex:1.1;min-height:14px;}
  .content-bottom-space{flex:0.9;min-height:8px;}

  .folio{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .folio-num{font-family:'Fraunces',serif;font-weight:600;font-size:14px;letter-spacing:0.5px;color:var(--gold);font-variant-numeric:tabular-nums;}
  .folio-rule{flex:1;height:1px;background:var(--rule-strong);}

  .kicker-inline{font-size:9.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:block;}

  .headline{font-weight:600;color:var(--text-primary);}
  .headline .hl{color:var(--gold);}
  .headline.capa{font-size:42px;line-height:0.99;letter-spacing:-1.1px;max-width:92%;margin-bottom:18px;}
  .headline.interior{font-size:27px;line-height:1.05;letter-spacing:-0.5px;margin-bottom:14px;}
  .headline.cta{font-size:30px;line-height:1.04;letter-spacing:-0.6px;text-align:center;margin-bottom:14px;}

  .body-text{font-size:14px;line-height:1.58;font-weight:400;letter-spacing:0.1px;color:var(--text-secondary);max-width:94%;}
  .headline.cta + .body-text{max-width:100%;text-align:center;margin:0 auto;}

  .chart-wrap{display:flex;flex-direction:column;margin-bottom:14px;}
  .chart-row{padding:12px 0;border-bottom:1px solid var(--hairline);}
  .chart-row:first-child{padding-top:0;}
  .chart-row-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .chart-label{font-size:11px;font-weight:600;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-secondary);}
  .chart-value{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--text-primary);font-variant-numeric:tabular-nums;}
  .chart-track{height:2px;background:var(--track-bg);position:relative;}
  .chart-fill{height:100%;}

  .stat-wrap{display:flex;flex-direction:column;gap:0;margin-bottom:16px;}
  .stat-value{font-size:68px;font-weight:600;color:var(--gold);line-height:0.96;letter-spacing:-2px;}
  .stat-rule{width:34px;height:1px;background:var(--rule-strong);margin:14px 0 10px;}
  .stat-label{font-size:12px;font-weight:500;color:var(--text-secondary);letter-spacing:0.2px;line-height:1.4;max-width:88%;}

  .swipe-hint{
    display:flex;align-items:center;gap:7px;
    color:var(--text-secondary);font-size:9.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;
  }

  .footer{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:0 28px 26px;gap:16px;}
  .footer-track{flex:1;height:1px;background:var(--track-bg);position:relative;}
  .footer-fill{position:absolute;left:0;top:0;height:100%;background:var(--gold);}
  .footer-label{font-family:'Fraunces',serif;font-size:11px;font-weight:500;letter-spacing:0.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums;white-space:nowrap;}

  .cta-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;}
  .cta-btn{
    display:inline-flex;align-items:center;gap:10px;padding:15px 30px;background:var(--gold);color:var(--ink);
    font-weight:700;font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;border-radius:2px;margin-top:22px;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const TONE_COLOR = { blue: 'var(--blue)', green: 'var(--green)', red: 'var(--red)', yellow: 'var(--yellow)', gold: 'var(--gold)' };

  function renderBarChart(v) {
    const bars = v.bars || [];
    const maxVal = v.maxOverride || Math.max(...bars.map(b => b.value), 1);
    const rows = bars.map(b => {
      const pct = Math.max(3, Math.round((b.value / maxVal) * 100));
      const color = TONE_COLOR[b.tone || 'gold'];
      return `<div class="chart-row">
        <div class="chart-row-top">
          <span class="chart-label">${b.label}</span>
          <span class="serif chart-value">${b.value}${v.unit || ''}</span>
        </div>
        <div class="chart-track"><div class="chart-fill" style="width:${pct}%;background:${color};"></div></div>
      </div>`;
    }).join("");
    return `<div class="chart-wrap">${rows}</div>`;
  }

  function renderStat(v) {
    return `<div class="stat-wrap">
      <div class="serif stat-value">${v.value}</div>
      <div class="stat-rule"></div>
      <div class="stat-label">${v.label}</div>
    </div>`;
  }

  function renderSlide(s, opts) {
    let inner = "";

    if (s.type === "capa") {
      const visualHtml = s.visual ? (s.visual.type === "stat" ? renderStat(s.visual) : renderBarChart(s.visual)) : "";
      inner = `
        <div class="content-top-space"></div>
        ${s.tag ? `<span class="kicker-inline">${s.tag}</span>` : ""}
        <h2 class="serif headline capa">${s.headline}</h2>
        ${visualHtml}
        ${s.body ? `<p class="body-text">${s.body}</p>` : ""}
        <div class="content-bottom-space"></div>
        ${opts.total > 1 ? `<div class="swipe-hint">
          <span>Arrasta pra ver</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>` : ""}`;
    } else if (s.type === "interior") {
      inner = `
        <div class="content-top-space"></div>
        ${opts.stepNumber ? `<div class="folio"><span class="folio-num">0${opts.stepNumber}</span><div class="folio-rule"></div></div>` : ""}
        <h2 class="serif headline interior">${s.headline}</h2>
        <p class="body-text">${s.body}</p>
        <div class="content-bottom-space"></div>`;
    } else if (s.type === "chart") {
      const visualHtml = s.visual && s.visual.type === "stat" ? renderStat(s.visual) : renderBarChart(s.visual || {});
      inner = `
        <div class="content-top-space"></div>
        ${opts.stepNumber ? `<div class="folio"><span class="folio-num">0${opts.stepNumber}</span><div class="folio-rule"></div></div>` : ""}
        <h2 class="serif headline interior">${s.headline}</h2>
        ${visualHtml}
        ${s.body ? `<p class="body-text">${s.body}</p>` : ""}
        <div class="content-bottom-space"></div>`;
    } else if (s.type === "cta") {
      inner = `
        <div class="content-top-space"></div>
        <div class="cta-wrap">
          <h2 class="serif headline cta">${s.headline}</h2>
          <p class="body-text">${s.body || ""}</p>
          <div class="cta-btn">${s.ctaLabel}</div>
        </div>
        <div class="content-bottom-space"></div>`;
    }

    // Rodapé sempre presente (mesmo em post único) — carrega a marca de
    // assinatura dourada; a barra/numeração de página só aparece com >1 slide.
    let footer;
    if (opts.total > 1) {
      const pct = ((opts.index + 1) / opts.total) * 100;
      const numLabel = String(opts.index + 1).padStart(2, "0") + " — " + String(opts.total).padStart(2, "0");
      footer = `<div class="footer">
        <div class="footer-track"><div class="footer-fill" style="width:${pct}%;"></div></div>
        <div class="footer-sig"></div>
        <span class="serif footer-label">${numLabel}</span>
      </div>`;
    } else {
      footer = `<div class="footer">
        <div style="flex:1;"></div>
        <div class="footer-sig"></div>
      </div>`;
    }

    const toneClass = opts.tone === "light" ? "tone-light" : "";
    return `<div class="slide ${toneClass}">
      <div class="masthead">
        <span class="wordmark">davidaraujogestor</span>
        ${s.type !== "capa" && s.tag ? `<span class="kicker">${s.tag}</span>` : ""}
      </div>
      <div class="content">${inner}</div>
      ${footer}
    </div>`;
  }

  const SLIDES = __SLIDES_DATA__;
  let stepCounter = 0;
  // "tag" da capa também vale pro carrossel inteiro (mostrado no masthead dos outros slides)
  const carouselTag = (SLIDES.find(s => s.type === "capa") || {}).tag;
  document.getElementById("root").innerHTML = SLIDES.map((s, i) => {
    const isNumbered = s.type === "interior" || s.type === "chart";
    if (isNumbered) stepCounter++;
    // Alterna tom claro/escuro a cada slide (capa mais escura, 2ª mais clara, 3ª mais escura...),
    // a menos que o slide especifique um "tone" próprio (ex.: post de imagem única sempre escuro).
    const tone = s.tone || (i % 2 === 0 ? "dark" : "light");
    const slideData = s.type === "capa" ? s : Object.assign({}, s, { tag: s.tag || carouselTag });
    return renderSlide(slideData, { total: SLIDES.length, index: i, stepNumber: isNumbered ? stepCounter : null, tone });
  }).join("");

  // Ajuste automático de tamanho — encolhe a manchete (e, se preciso, o número
  // grande de estatística) até o conteúdo caber na altura fixa do slide, pra
  // texto longo nunca estourar e cortar o rodapé/marcação de página.
  function fitSlide(slideEl) {
    const shrinkTargets = [slideEl.querySelector(".headline"), slideEl.querySelector(".stat-value")].filter(Boolean);
    if (!shrinkTargets.length) return;
    let guard = 0;
    while (slideEl.scrollHeight > slideEl.clientHeight + 1 && guard < 60) {
      let shrunkAny = false;
      for (const el of shrinkTargets) {
        const cur = parseFloat(getComputedStyle(el).fontSize);
        const min = el.classList.contains("stat-value") ? 34 : 19;
        if (cur > min) {
          el.style.fontSize = (cur - 1) + "px";
          shrunkAny = true;
        }
      }
      if (!shrunkAny) break;
      guard++;
    }
  }

  function fitAllSlides() {
    document.querySelectorAll(".slide").forEach(fitSlide);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitAllSlides);
  } else {
    fitAllSlides();
  }
  // Segunda passada depois de um instante, pra pegar qualquer reflow tardio de fonte.
  setTimeout(fitAllSlides, 400);
</script>
</body>
</html>
